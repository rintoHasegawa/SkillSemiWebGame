version: "3.8"

services:
  app:
    container_name: pixel-paint-war-dev
    # 開発用イメージ: Node.js v20 (定義書準拠)
    image: mcr.microsoft.com/devcontainers/typescript-node:20

    # 永続化とボリュームマウント
    volumes:
      # カレントディレクトリをコンテナ内の /workspace にマウント
      - .:/workspace:cached

      # 【重要】ここを追加してください
      # コンテナ内の node_modules をホスト側と切り離して高速化・安定化させる設定
      - node_modules:/workspace/node_modules

      # 認証情報の永続化 (Rebuild しても再ログイン不要にする)
      # Claude Code の認証・設定・メモリ (~/.claude)
      - claude-config:/home/node/.claude
      # GitHub CLI の認証 (~/.config/gh)
      - gh-config:/home/node/.config/gh
      # Claude Code CLI 本体 (~/.local/bin のリンクと ~/.local/share/claude の実体)
      - claude-local:/home/node/.local

    # コマンドの上書き (コンテナを常時起動させる)
    command: sleep infinity

    # ネットワーク設定
    # Client(5173) と Server(3000) のポートを開放
    ports:
      - "5173:5173"
      - "3000:3000"

    # 環境変数
    environment:
      - NODE_ENV=development
      # pnpmのストアをローカルと分離して高速化したい場合は設定推奨（今回はシンプルにします）
      # Claude Code の設定ファイル (~/.claude.json 相当) も永続化ボリューム内に置く
      - CLAUDE_CONFIG_DIR=/home/node/.claude

    # ユーザー権限 (Nodeイメージ推奨のユーザー)
    user: node

volumes:
  node_modules:
  claude-config:
  gh-config:
  claude-local:
